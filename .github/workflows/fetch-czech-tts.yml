name: Fetch Czech TTS assets

on:
  push:
    branches:
      - tts-assets
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download Piper and Czech voice
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tts-assets
          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz \
            -o tts-assets/piper_linux_x86_64.tar.gz
          curl -fL --retry 5 --retry-delay 2 \
            https://huggingface.co/Thomcles/Piper-TTS-Czech/resolve/main/medium/model.onnx \
            -o tts-assets/cs_CZ-honza-medium.onnx
          curl -fL --retry 5 --retry-delay 2 \
            https://huggingface.co/Thomcles/Piper-TTS-Czech/resolve/main/medium/model.onnx.json \
            -o tts-assets/cs_CZ-honza-medium.onnx.json
          sha256sum tts-assets/* > tts-assets/SHA256SUMS.txt

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: czech-tts-assets
          path: tts-assets/
          retention-days: 1
          compression-level: 0
